<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">Pratham — Building for the offline web</title><desc id="desc">A dark navy profile banner with electric blue and crimson accents, a waveform, and a welcoming message.</desc>
<defs>
